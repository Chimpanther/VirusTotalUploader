name: Droid Wiki Refresh

on:
  push:
    branches: [master]

permissions: {}

jobs:
  wiki-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Factory Droid
        run: |
          curl -fsSL https://app.factory.ai/cli/v1.2.3/install.sh -o install.sh
          # ACTION REQUIRED: Replace the placeholder checksum below with the actual sha256sum of install.sh
          echo "PLACEHOLDER_SHA256_CHECKSUM_HERE install.sh" | sha256sum -c -
          sh install.sh

      - name: Generate wiki
        run: droid exec --auto high "/wiki"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
